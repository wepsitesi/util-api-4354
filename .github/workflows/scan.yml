name: scan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_PASSWORD: ${{ secrets.DISCORD_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO_INDEX: '0'
        run: node worker.js
