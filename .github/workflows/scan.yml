name: run
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        index: [0, 1, 2, 3]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run worker
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_PASSWORD: ${{ secrets.DISCORD_PASSWORD }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          COORDINATOR_URL: ${{ secrets.COORDINATOR_URL }}
          MATRIX_INDEX: ${{ matrix.index }}
          WORKER_ID: ${{ github.repository }}-${{ github.run_id }}-${{ matrix.index }}
        run: node worker.js || true
      - name: Re-trigger
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scan.yml/dispatches" \
            -d '{"ref":"main"}' || true
